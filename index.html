<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Data Visualization Demo</title>
  <!-- Include the ECharts file you just downloaded -->
  <script src="
  https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js
  "></script>
  <link rel="stylesheet" href="./styles.css">
</head>

<body id="top">
  <!-- Prepare a DOM with a defined width and height for ECharts -->
  <h1>Apache ECharts Demo</h1>
  <ul>
    <li><a href="#line">Line</a></li>
    <li><a href="#bar">Bar</a></li>
    <li><a href="#donut">Donut</a></li>
    <li><a href="#pie">Pie</a></li>
    <li><a href="#funnel">Funnel</a></li>
    <li><a href="#scatter">Scatter Plot</a></li>
    <li><a href="#stacked-bar">Stacked Bar</a></li>
    <li><a href="#grouped-bar">Grouped Bar</a></li>
    <li><a href="#box-plot">Box Plot</a></li>
    <li><a href="#map">Geo Heatmap with Pins</a></li>
  </ul>
  <div id="line" class="chart"></div>
  <div id="bar" class="chart"></div>
  <div id="donut" class="chart"></div>
  <div id="pie" class="chart"></div>
  <div id="funnel" class="chart"></div>
  <div id="scatter" class="chart"></div>
  <div id="stacked-bar" class="chart"></div>
  <div id="grouped-bar" class="chart"></div>
  <div id="box-plot" class="chart"></div>
  <div id="map"></div>
  <div class="fixed"><a href="#top">Back to Top</a></div>
  <script type="module" src="./index.js"></script>
</body>

</html>
